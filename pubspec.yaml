name: wheather_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.18.0
  permission_handler: ^11.0.1
  geolocator: ^10.1.0
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  snapshot: ^0.2.6+3
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"
  flutter_native_splash: ^2.3.2
flutter:
  uses-material-design: true

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-BlackItalic.ttf
          weight: 900
          style: italic

# This section should be at the root level, NOT inside flutter:
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon_weather.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
flutter_native_splash:
  color: "#0B1D26"
  image: assets/icon/app_icon_weather.png
  fullscreen: true

  android_12:
    color: "#0B1D26"
    image: assets/icon/app_icon_weather.png
    icon_background_color: "#0B1D26"